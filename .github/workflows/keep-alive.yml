name: Keep Render instance awake

on:
  schedule:
    # Every 10 minutes — comfortably under Render's ~15 minute idle timeout.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the site
        run: curl -fsS --max-time 30 "https://my-portfolio-p52y.onrender.com/" > /dev/null
